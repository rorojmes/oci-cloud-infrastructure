# Virtual Host for cv.robertmesa.es
# Professional CV subdomain at /var/www/html

server {
    server_name cv.robertmesa.es;
    root /var/www/html;
    index index.html;

    # Gzip optimized for CV (text, code, assets)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # SPA fallback (if CV uses client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cv.robertmesa.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv.robertmesa.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name cv.robertmesa.es;

    # Certbot validation path (required for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
